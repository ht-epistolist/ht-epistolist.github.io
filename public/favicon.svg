<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sky blue background circle (Discord-style emoji bg) -->
  <circle cx="50" cy="50" r="50" fill="#5865F2"/>

  <!-- Snowman body - bottom large ball -->
  <circle cx="50" cy="72" r="18" fill="#E8F4FD" stroke="#C8DFF0" stroke-width="1.5"/>
  <!-- Snowman body - top smaller ball (head) -->
  <circle cx="50" cy="42" r="13" fill="#E8F4FD" stroke="#C8DFF0" stroke-width="1.5"/>

  <!-- Hat brim -->
  <rect x="33" y="28" width="34" height="4" rx="2" fill="#1a1a2e"/>
  <!-- Hat top -->
  <rect x="37" y="12" width="26" height="18" rx="3" fill="#1a1a2e"/>
  <!-- Hat band -->
  <rect x="37" y="23" width="26" height="4" fill="#DD2E44"/>

  <!-- Eyes -->
  <circle cx="44" cy="40" r="2.2" fill="#1a1a2e"/>
  <circle cx="56" cy="40" r="2.2" fill="#1a1a2e"/>

  <!-- Smile dots -->
  <circle cx="43" cy="47" r="1.5" fill="#1a1a2e"/>
  <circle cx="47" cy="50" r="1.5" fill="#1a1a2e"/>
  <circle cx="50" cy="51" r="1.5" fill="#1a1a2e"/>
  <circle cx="53" cy="50" r="1.5" fill="#1a1a2e"/>
  <circle cx="57" cy="47" r="1.5" fill="#1a1a2e"/>

  <!-- Carrot nose -->
  <polygon points="50,43 58,45 50,47" fill="#F4900C"/>

  <!-- Buttons on body -->
  <circle cx="50" cy="62" r="2.2" fill="#1a1a2e"/>
  <circle cx="50" cy="70" r="2.2" fill="#1a1a2e"/>
  <circle cx="50" cy="78" r="2.2" fill="#1a1a2e"/>

  <!-- Left arm (twig) -->
  <line x1="32" y1="65" x2="20" y2="55" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="55" x2="14" y2="50" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="55" x2="15" y2="58" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>

  <!-- Right arm (twig) -->
  <line x1="68" y1="65" x2="80" y2="55" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="55" x2="86" y2="50" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="55" x2="85" y2="58" stroke="#8B4513" stroke-width="2" stroke-linecap="round"/>

  <!-- Scarf -->
  <path d="M 37 54 Q 50 58 63 54" stroke="#DD2E44" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 37 54 Q 35 60 38 65" stroke="#DD2E44" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>